spring:
  application:
    name: coopgoal-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/coopgoal}
    username: ${DB_USERNAME:coopgoal}
    password: ${DB_PASSWORD:coopgoal-local}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null
  task:
    scheduling:
      pool:
        size: 2

server:
  error:
    include-message: never

security:
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION:PT8H}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized

logging:
  structured:
    format:
      console: logstash

coopgoal:
  recurring:
    fixed-delay: ${RECURRING_FIXED_DELAY:PT1H}
